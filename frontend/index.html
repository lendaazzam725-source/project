<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Expense Tracker</span>
        </div>
    </nav>

    <main class="container pb-5">
        <div id="alerts"></div>

        <section class="summary-grid mb-4">
            <div>
                <div class="card">
                    <div class="card-body">
                        <div class="text-muted small">Total spent</div>
                        <div class="fs-2 fw-semibold" id="sum-total">0.00</div>
                    </div>
                </div>
            </div>
            <div>
                <div class="card">
                    <div class="card-body">
                        <div class="text-muted small">Number of expenses</div>
                        <div class="fs-2 fw-semibold" id="sum-count">0</div>
                    </div>
                </div>
            </div>
            <div>
                <div class="card">
                    <div class="card-body">
                        <div class="text-muted small">Highest expense</div>
                        <div class="fs-2 fw-semibold" id="sum-top">—</div>
                    </div>
                </div>
            </div>
        </section>

        <div class="card mb-4">
            <div class="card-body">
                <h2 class="h5 mb-3">Add Expense</h2>
                <form id="add-form" class="row g-2" novalidate>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="title" placeholder="Title">
                        <div class="invalid-feedback" id="title-error">Title is required.</div>
                    </div>
                    <div class="col-md-2">
                        <input type="number" step="0.01" class="form-control" id="amount" placeholder="Amount">
                        <div class="invalid-feedback" id="amount-error">Enter an amount greater than 0.</div>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="category">
                            <option value="">Choose...</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                        <div class="invalid-feedback" id="category-error">Choose a category.</div>
                    </div>
                    <div class="col-md-2">
                        <input type="date" class="form-control" id="date">
                        <div class="invalid-feedback" id="date-error">Pick a date.</div>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">Add Expense</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div id="spinner" class="text-center py-3">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 mb-0">Expenses</h2>
                    <div class="d-flex align-items-center gap-2">
                        <label class="form-label mb-0">Category</label>
                        <select class="form-select w-auto" id="filter-category">
                            <option value="">All</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expenses-table"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="edit-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Expense</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-form">
                        <input type="hidden" id="edit-id">
                        <div class="mb-2">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="edit-title" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Amount</label>
                            <input type="number" step="0.01" class="form-control" id="edit-amount" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="edit-category" required>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" id="edit-date" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
